<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="1180" height="640" fill="#0A0E13"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3A4756"/>
    </marker>
  </defs>

  <text x="40" y="40" fill="#E8EDF2" font-size="20" font-weight="600">AetherLog-Inspired AI Incident Investigator — Architecture</text>
  <text x="40" y="62" fill="#8B98A8" font-size="12">Documents → Entity Extraction → Knowledge Graph + Embeddings → Hybrid Retrieval → RCA → Timeline → Report</text>

  <!-- Row 1: Ingestion -->
  <g>
    <rect x="40" y="100" width="180" height="70" rx="8" fill="#101720" stroke="#1E2A36"/>
    <text x="130" y="130" fill="#E8EDF2" font-size="13" text-anchor="middle">Uploaded Sources</text>
    <text x="130" y="150" fill="#8B98A8" font-size="10" text-anchor="middle">.log .pdf .txt runbooks</text>
  </g>

  <line x1="220" y1="135" x2="270" y2="135" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="270" y="100" width="200" height="70" rx="8" fill="#101720" stroke="#1E2A36"/>
    <text x="370" y="125" fill="#E8EDF2" font-size="13" text-anchor="middle">Ingestion Pipeline</text>
    <text x="370" y="143" fill="#8B98A8" font-size="10" text-anchor="middle">document_loader / log_loader</text>
    <text x="370" y="158" fill="#8B98A8" font-size="10" text-anchor="middle">chunker → summarizer</text>
  </g>

  <line x1="470" y1="135" x2="520" y2="135" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="520" y="100" width="220" height="70" rx="8" fill="#101720" stroke="#F0A639"/>
    <text x="630" y="125" fill="#F0A639" font-size="13" text-anchor="middle">Entity Extractor (Gemini)</text>
    <text x="630" y="143" fill="#8B98A8" font-size="10" text-anchor="middle">SERVICE · ERROR · DATABASE</text>
    <text x="630" y="158" fill="#8B98A8" font-size="10" text-anchor="middle">API · EVENT · SYSTEM</text>
  </g>

  <!-- Row 2: Storage -->
  <line x1="630" y1="170" x2="630" y2="220" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="230" width="220" height="80" rx="8" fill="#101720" stroke="#31C6AD"/>
    <text x="490" y="256" fill="#31C6AD" font-size="13" text-anchor="middle">Knowledge Graph — Neo4j</text>
    <text x="490" y="276" fill="#8B98A8" font-size="10" text-anchor="middle">CAUSES · DEPENDS_ON · TRIGGERS</text>
    <text x="490" y="292" fill="#8B98A8" font-size="10" text-anchor="middle">RELATED_TO · CONTAINS</text>
  </g>

  <g>
    <rect x="660" y="230" width="220" height="80" rx="8" fill="#101720" stroke="#7C9CF0"/>
    <text x="770" y="256" fill="#7C9CF0" font-size="13" text-anchor="middle">Vector Store — Qdrant</text>
    <text x="770" y="276" fill="#8B98A8" font-size="10" text-anchor="middle">BAAI/bge-large-en-v1.5</text>
    <text x="770" y="292" fill="#8B98A8" font-size="10" text-anchor="middle">embeddings per chunk</text>
  </g>

  <line x1="600" y1="270" x2="660" y2="270" stroke="#3A4756" stroke-width="1"/>

  <!-- Row 3: Retrieval -->
  <line x1="490" y1="310" x2="490" y2="345" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="310" x2="770" y2="345" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="355" width="500" height="60" rx="8" fill="#101720" stroke="#1E2A36"/>
    <text x="630" y="382" fill="#E8EDF2" font-size="13" text-anchor="middle">Hybrid Retriever</text>
    <text x="630" y="400" fill="#8B98A8" font-size="10" text-anchor="middle">graph search (Neo4j / NetworkX) + vector search (Qdrant) merged per query</text>
  </g>

  <!-- Row 4: Reasoning -->
  <line x1="630" y1="415" x2="630" y2="450" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="300" y="460" width="180" height="70" rx="8" fill="#101720" stroke="#E5555C"/>
    <text x="390" y="488" fill="#E5555C" font-size="13" text-anchor="middle">Root Cause Analyzer</text>
    <text x="390" y="506" fill="#8B98A8" font-size="10" text-anchor="middle">cause chain + confidence</text>
  </g>

  <g>
    <rect x="500" y="460" width="180" height="70" rx="8" fill="#101720" stroke="#1E2A36"/>
    <text x="590" y="488" fill="#E8EDF2" font-size="13" text-anchor="middle">Timeline Builder</text>
    <text x="590" y="506" fill="#8B98A8" font-size="10" text-anchor="middle">chronological reconstruction</text>
  </g>

  <g>
    <rect x="700" y="460" width="180" height="70" rx="8" fill="#101720" stroke="#1E2A36"/>
    <text x="790" y="488" fill="#E8EDF2" font-size="13" text-anchor="middle">Report Generator</text>
    <text x="790" y="506" fill="#8B98A8" font-size="10" text-anchor="middle">executive summary + recs</text>
  </g>

  <line x1="480" y1="495" x2="500" y2="495" stroke="#3A4756" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="680" y1="495" x2="700" y2="495" stroke="#3A4756" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 5: Output -->
  <line x1="790" y1="530" x2="790" y2="565" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="640" y="575" width="300" height="55" rx="8" fill="#101720" stroke="#F0A639"/>
    <text x="790" y="600" fill="#F0A639" font-size="13" text-anchor="middle">RCA Report + Investigation Chat</text>
    <text x="790" y="617" fill="#8B98A8" font-size="10" text-anchor="middle">served to Next.js frontend via FastAPI</text>
  </g>

  <!-- Frontend box, top right -->
  <g>
    <rect x="960" y="100" width="180" height="200" rx="8" fill="#101720" stroke="#1E2A36"/>
    <text x="1050" y="128" fill="#E8EDF2" font-size="13" text-anchor="middle">Next.js Frontend</text>
    <text x="1050" y="150" fill="#8B98A8" font-size="10" text-anchor="middle">Dashboard</text>
    <text x="1050" y="168" fill="#8B98A8" font-size="10" text-anchor="middle">Upload Center</text>
    <text x="1050" y="186" fill="#8B98A8" font-size="10" text-anchor="middle">Investigation Workspace</text>
    <text x="1050" y="204" fill="#8B98A8" font-size="10" text-anchor="middle">Knowledge Graph Viewer</text>
    <text x="1050" y="222" fill="#8B98A8" font-size="10" text-anchor="middle">Timeline Viewer</text>
    <text x="1050" y="240" fill="#8B98A8" font-size="10" text-anchor="middle">RCA Report Viewer</text>
    <text x="1050" y="258" fill="#8B98A8" font-size="10" text-anchor="middle">Chat Assistant</text>
  </g>
  <line x1="880" y1="200" x2="960" y2="200" stroke="#3A4756" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
