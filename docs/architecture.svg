<svg viewBox="0 0 1200 1250" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AetherLog-Inspired AI Incident Investigator - Architecture</title>
  <rect width="1200" height="1250" fill="#0A0E13"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5A6675"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F0A639"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#31C6AD"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" fill="#E8EDF2" font-size="22" font-weight="700">AetherLog-Inspired AI Incident Investigator — Architecture</text>
  <text x="40" y="68" fill="#8B98A8" font-size="13">Large logs are processed locally and reduced to bounded evidence; Gemini reasons once over that evidence, with a deterministic fallback.</text>

  <!-- ===================== MAIN PIPELINE (left) ===================== -->

  <!-- 1. User / Frontend -->
  <rect x="40" y="96" width="680" height="52" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="380" y="119" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">User / Frontend</text>
  <text x="380" y="138" fill="#8B98A8" font-size="11.5" text-anchor="middle">Next.js · upload · workspace · report · timeline · graph · chat</text>
  <line x1="380" y1="148" x2="380" y2="174" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. FastAPI Backend -->
  <rect x="40" y="178" width="680" height="52" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="380" y="201" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">FastAPI Backend</text>
  <text x="380" y="220" fill="#8B98A8" font-size="11.5" text-anchor="middle">thin API routes · services layer · per-request Gemini call limits &amp; metrics</text>
  <line x1="380" y1="230" x2="380" y2="256" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Log Upload & Investigation -->
  <rect x="40" y="260" width="680" height="56" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="380" y="284" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Log Upload &amp; Investigation</text>
  <text x="380" y="304" fill="#8B98A8" font-size="11.5" text-anchor="middle">POST /upload  ·  POST /investigate</text>
  <line x1="380" y1="316" x2="380" y2="344" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Deterministic Log Processing -->
  <rect x="40" y="348" width="680" height="104" rx="10" fill="#101720" stroke="#31C6AD" stroke-opacity="0.55"/>
  <rect x="40" y="348" width="5" height="104" rx="2" fill="#31C6AD"/>
  <text x="60" y="374" fill="#E8EDF2" font-size="15" font-weight="600">Deterministic Log Processing</text>
  <rect x="582" y="358" width="122" height="22" rx="11" fill="#1E4A42"/>
  <text x="643" y="373" fill="#31C6AD" font-size="11" font-weight="600" text-anchor="middle">0 Gemini calls</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="57" y="396" width="70" height="28" rx="6" fill="#141D28" stroke="#1E2A36"/>
    <text x="92" y="414" fill="#E8EDF2">parsing</text>
    <text x="138" y="414" fill="#5A6675">→</text>
    <rect x="149" y="396" width="108" height="28" rx="6" fill="#141D28" stroke="#1E2A36"/>
    <text x="203" y="414" fill="#E8EDF2">event grouping</text>
    <text x="268" y="414" fill="#5A6675">→</text>
    <rect x="279" y="396" width="134" height="28" rx="6" fill="#141D28" stroke="#1E2A36"/>
    <text x="346" y="414" fill="#E8EDF2">template extraction</text>
    <text x="424" y="414" fill="#5A6675">→</text>
    <rect x="435" y="396" width="104" height="28" rx="6" fill="#141D28" stroke="#1E2A36"/>
    <text x="487" y="414" fill="#E8EDF2">deduplication</text>
    <text x="550" y="414" fill="#5A6675">→</text>
    <rect x="561" y="396" width="122" height="28" rx="6" fill="#141D28" stroke="#1E2A36"/>
    <text x="622" y="414" fill="#E8EDF2">entity extraction</text>
  </g>
  <text x="60" y="442" fill="#8B98A8" font-size="11">complete events (multiline / stack traces kept whole) · every instance kept in the event store</text>
  <line x1="380" y1="452" x2="380" y2="478" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Evidence Selection & Relevance Ranking -->
  <rect x="40" y="482" width="680" height="56" rx="10" fill="#101720" stroke="#31C6AD" stroke-opacity="0.55"/>
  <rect x="40" y="482" width="5" height="56" rx="2" fill="#31C6AD"/>
  <text x="380" y="506" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Evidence Selection &amp; Relevance Ranking</text>
  <text x="380" y="526" fill="#8B98A8" font-size="11.5" text-anchor="middle">severity · RCA signals · rarity · incident window · question relevance</text>
  <line x1="380" y1="538" x2="380" y2="566" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Critical Evidence Protection + Hard Token Budget -->
  <rect x="40" y="570" width="680" height="56" rx="10" fill="#101720" stroke="#31C6AD" stroke-opacity="0.55"/>
  <rect x="40" y="570" width="5" height="56" rx="2" fill="#31C6AD"/>
  <text x="380" y="594" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Critical Evidence Protection + Hard Token Budget</text>
  <text x="380" y="614" fill="#8B98A8" font-size="11.5" text-anchor="middle">errors · diagnoses · recovery protected · whole events only · evidence ≤ 4,000 tokens, prompt ≤ 6,000</text>
  <line x1="380" y1="626" x2="380" y2="654" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Qdrant + Knowledge Graph -->
  <rect x="40" y="658" width="680" height="100" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="380" y="681" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Qdrant Vector Retrieval + Knowledge Graph</text>
  <rect x="60" y="694" width="300" height="50" rx="8" fill="#141D28" stroke="#7C9CF0" stroke-opacity="0.7"/>
  <text x="210" y="715" fill="#7C9CF0" font-size="13" font-weight="600" text-anchor="middle">Qdrant</text>
  <text x="210" y="733" fill="#8B98A8" font-size="11" text-anchor="middle">one embedding per event group</text>
  <rect x="380" y="694" width="320" height="50" rx="8" fill="#141D28" stroke="#7C9CF0" stroke-opacity="0.7"/>
  <text x="540" y="712" fill="#7C9CF0" font-size="13" font-weight="600" text-anchor="middle">Knowledge Graph</text>
  <rect x="392" y="720" width="140" height="18" rx="9" fill="none" stroke="#8B98A8" stroke-dasharray="4 3"/>
  <text x="462" y="733" fill="#8B98A8" font-size="10.5" text-anchor="middle">Neo4j when available</text>
  <rect x="540" y="720" width="150" height="18" rx="9" fill="#1E2A36"/>
  <text x="615" y="733" fill="#E8EDF2" font-size="10.5" text-anchor="middle">in-memory graph fallback</text>
  <line x1="380" y1="758" x2="380" y2="784" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Bounded Evidence Context -->
  <rect x="40" y="788" width="680" height="52" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="380" y="811" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Bounded Evidence Context</text>
  <text x="380" y="830" fill="#8B98A8" font-size="11.5" text-anchor="middle">cited event IDs · timeline skeleton · explicit graph facts — never the raw log</text>
  <line x1="380" y1="840" x2="380" y2="866" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Reasoning Layer -->
  <rect x="40" y="870" width="680" height="120" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="380" y="893" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Reasoning Layer</text>
  <rect x="60" y="906" width="300" height="68" rx="8" fill="#141D28" stroke="#F0A639"/>
  <text x="210" y="930" fill="#F0A639" font-size="14" font-weight="700" text-anchor="middle">Gemini</text>
  <text x="210" y="948" fill="#E8EDF2" font-size="12" text-anchor="middle">ONE logical reasoning call</text>
  <text x="210" y="964" fill="#8B98A8" font-size="10.5" text-anchor="middle">bounded retries · deadline · validated output</text>
  <rect x="400" y="906" width="300" height="68" rx="8" fill="#141D28" stroke="#31C6AD" stroke-dasharray="5 4"/>
  <text x="550" y="930" fill="#31C6AD" font-size="14" font-weight="700" text-anchor="middle">Deterministic RCA fallback</text>
  <text x="550" y="948" fill="#E8EDF2" font-size="12" text-anchor="middle">evidence-scored · no LLM</text>
  <text x="550" y="964" fill="#8B98A8" font-size="10.5" text-anchor="middle">used if Gemini fails (429 · 503 · timeout · invalid)</text>
  <line x1="360" y1="940" x2="396" y2="940" stroke="#31C6AD" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-teal)"/>
  <line x1="380" y1="990" x2="380" y2="1016" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 10. Evidence-Grounded RCA -->
  <rect x="40" y="1020" width="680" height="76" rx="10" fill="#101720" stroke="#F0A639" stroke-opacity="0.55"/>
  <text x="380" y="1044" fill="#E8EDF2" font-size="15" font-weight="600" text-anchor="middle">Evidence-Grounded RCA</text>
  <text x="380" y="1064" fill="#E8EDF2" font-size="12" text-anchor="middle">root cause · confidence · cause chain · timeline · affected services · recommendations</text>
  <text x="380" y="1083" fill="#8B98A8" font-size="11" text-anchor="middle">claims cite event IDs · OBSERVED / INFERRED / LIKELY / CONFIRMED / UNKNOWN</text>
  <line x1="380" y1="1096" x2="380" y2="1122" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 11. Outputs -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40" y="1126" width="155" height="44" rx="22" fill="#141D28" stroke="#1E2A36"/>
    <text x="117" y="1153" fill="#E8EDF2">Report</text>
    <rect x="215" y="1126" width="155" height="44" rx="22" fill="#141D28" stroke="#1E2A36"/>
    <text x="292" y="1153" fill="#E8EDF2">Timeline</text>
    <rect x="390" y="1126" width="155" height="44" rx="22" fill="#141D28" stroke="#1E2A36"/>
    <text x="467" y="1153" fill="#E8EDF2">Knowledge Graph</text>
    <rect x="565" y="1126" width="155" height="44" rx="22" fill="#141D28" stroke="#F0A639" stroke-opacity="0.7"/>
    <text x="642" y="1153" fill="#E8EDF2">Chat</text>
  </g>

  <!-- ===================== RIGHT COLUMN ===================== -->

  <!-- Gemini call policy -->
  <rect x="760" y="96" width="400" height="134" rx="10" fill="#101720" stroke="#F0A639" stroke-opacity="0.55"/>
  <text x="780" y="122" fill="#F0A639" font-size="14" font-weight="700">Gemini call policy</text>
  <g font-size="12.5">
    <text x="780" y="148" fill="#E8EDF2">Upload</text>
    <text x="1140" y="148" fill="#31C6AD" font-weight="700" text-anchor="end">0 calls</text>
    <text x="780" y="170" fill="#E8EDF2">Investigation</text>
    <text x="1140" y="170" fill="#F0A639" font-weight="700" text-anchor="end">1 logical call</text>
    <text x="780" y="192" fill="#E8EDF2">Chat</text>
    <text x="1140" y="192" fill="#F0A639" font-weight="700" text-anchor="end">1 logical call / question</text>
  </g>
  <text x="780" y="216" fill="#8B98A8" font-size="11">Never per log line, chunk or event — independent of log size.</text>

  <!-- Chat flow -->
  <rect x="760" y="260" width="400" height="580" rx="10" fill="#0D131A" stroke="#1E2A36"/>
  <text x="780" y="286" fill="#E8EDF2" font-size="14" font-weight="700">Investigation Chat — per question</text>
  <text x="780" y="304" fill="#8B98A8" font-size="11">reuses the same event store, evidence selector and budgets</text>

  <rect x="780" y="320" width="360" height="46" rx="8" fill="#101720" stroke="#1E2A36"/>
  <text x="960" y="348" fill="#E8EDF2" font-size="13" font-weight="600" text-anchor="middle">User Question</text>
  <line x1="960" y1="366" x2="960" y2="390" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="394" width="360" height="52" rx="8" fill="#101720" stroke="#31C6AD" stroke-opacity="0.55"/>
  <text x="960" y="416" fill="#E8EDF2" font-size="13" font-weight="600" text-anchor="middle">Evidence Selection</text>
  <text x="960" y="434" fill="#8B98A8" font-size="11" text-anchor="middle">question-aware ranking · protected evidence</text>
  <line x1="960" y1="446" x2="960" y2="470" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="474" width="360" height="52" rx="8" fill="#101720" stroke="#31C6AD" stroke-opacity="0.55"/>
  <text x="960" y="496" fill="#E8EDF2" font-size="13" font-weight="600" text-anchor="middle">Bounded Evidence</text>
  <text x="960" y="514" fill="#8B98A8" font-size="11" text-anchor="middle">whole events · ≤ 3,000 evidence tokens</text>
  <line x1="960" y1="526" x2="960" y2="550" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="554" width="360" height="52" rx="8" fill="#141D28" stroke="#F0A639"/>
  <text x="960" y="576" fill="#F0A639" font-size="13" font-weight="700" text-anchor="middle">ONE Gemini Call</text>
  <text x="960" y="594" fill="#8B98A8" font-size="11" text-anchor="middle">bounded retries · chat deadline</text>

  <!-- branch -->
  <line x1="870" y1="606" x2="870" y2="646" stroke="#F0A639" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="878" y="632" fill="#F0A639" font-size="10.5">success</text>
  <line x1="1050" y1="606" x2="1050" y2="646" stroke="#31C6AD" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-teal)"/>
  <text x="1058" y="632" fill="#31C6AD" font-size="10.5">if Gemini fails</text>

  <rect x="780" y="650" width="175" height="74" rx="8" fill="#101720" stroke="#F0A639" stroke-opacity="0.7"/>
  <text x="867" y="674" fill="#E8EDF2" font-size="12.5" font-weight="600" text-anchor="middle">Evidence-Grounded</text>
  <text x="867" y="691" fill="#E8EDF2" font-size="12.5" font-weight="600" text-anchor="middle">Answer</text>
  <text x="867" y="711" fill="#8B98A8" font-size="10.5" text-anchor="middle">validated citations</text>

  <rect x="965" y="650" width="175" height="74" rx="8" fill="#101720" stroke="#31C6AD" stroke-dasharray="5 4"/>
  <text x="1052" y="674" fill="#31C6AD" font-size="12.5" font-weight="600" text-anchor="middle">Deterministic</text>
  <text x="1052" y="691" fill="#31C6AD" font-size="12.5" font-weight="600" text-anchor="middle">Fallback</text>
  <text x="1052" y="711" fill="#8B98A8" font-size="10.5" text-anchor="middle">answers the question</text>

  <line x1="867" y1="724" x2="930" y2="766" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1052" y1="724" x2="990" y2="766" stroke="#5A6675" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="770" width="360" height="50" rx="8" fill="#101720" stroke="#1E2A36"/>
  <text x="960" y="792" fill="#E8EDF2" font-size="13" font-weight="600" text-anchor="middle">Answer in the Chat UI</text>
  <text x="960" y="809" fill="#8B98A8" font-size="11" text-anchor="middle">cited event IDs · always returned (no stuck state)</text>

  <!-- Failure handling -->
  <rect x="760" y="870" width="400" height="120" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="780" y="895" fill="#E8EDF2" font-size="14" font-weight="700">Graceful degradation</text>
  <g font-size="11.5" fill="#8B98A8">
    <text x="780" y="918">Gemini 429 / 503 / timeout / invalid output → deterministic</text>
    <text x="780" y="935">answer from the same evidence (reasoning_mode, degraded).</text>
    <text x="780" y="958">Neo4j unavailable → in-memory graph; pipeline continues.</text>
    <text x="780" y="978">Investigations never stay stuck in PROCESSING.</text>
  </g>

  <!-- Legend -->
  <rect x="760" y="1020" width="400" height="150" rx="10" fill="#101720" stroke="#1E2A36"/>
  <text x="780" y="1045" fill="#E8EDF2" font-size="14" font-weight="700">Legend</text>
  <g font-size="12">
    <rect x="780" y="1060" width="18" height="12" rx="3" fill="#31C6AD"/>
    <text x="808" y="1071" fill="#E8EDF2">Local, deterministic processing (no LLM)</text>
    <rect x="780" y="1084" width="18" height="12" rx="3" fill="#7C9CF0"/>
    <text x="808" y="1095" fill="#E8EDF2">Retrieval stores (Qdrant, knowledge graph)</text>
    <rect x="780" y="1108" width="18" height="12" rx="3" fill="#F0A639"/>
    <text x="808" y="1119" fill="#E8EDF2">Gemini reasoning (one logical call)</text>
    <rect x="780" y="1132" width="18" height="12" rx="3" fill="none" stroke="#8B98A8" stroke-dasharray="3 2"/>
    <text x="808" y="1143" fill="#E8EDF2">Optional / fallback path</text>
  </g>
  <text x="780" y="1162" fill="#8B98A8" font-size="10.5">Large logs never reach Gemini raw — only bounded evidence.</text>
</svg>
